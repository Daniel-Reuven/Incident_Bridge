<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard — Incident Bridge</title>
<link rel="stylesheet" href="/css/styles.css">
<script src="/js/theme.js"></script>
</head>
<body>
  <header id="topbar"></header>
  <main class="dashboard">
    <div class="dashboard-toolbar">
      <div class="filters">
        <label class="filter-search">Filter
          <input type="search" id="filter-text" placeholder="Title, description or comments" autocomplete="off">
        </label>
        <label id="filter-type-label">Type
          <select id="filter-type">
            <option value="">All</option>
            <option value="maintenance">Maintenance</option>
            <option value="fault">Fault</option>
          </select>
        </label>
        <label id="filter-status-label">Status
          <select id="filter-status">
            <option value="">All</option>
            <option value="open">Open</option>
            <option value="in_progress">In progress</option>
            <option value="closed">Closed</option>
          </select>
        </label>
        <div class="sort-group" id="sort-group">
          <label>Sort by
            <select id="sort-by">
              <option value="severity">Severity</option>
              <option value="status">Status</option>
              <option value="created_at">Reported</option>
            </select>
          </label>
          <button type="button" class="btn btn-ghost sort-order" id="sort-order" aria-describedby="sort-by"></button>
        </div>
      </div>
      <div class="actions-row" style="margin-bottom:0">
        <label class="inline-select" id="stale-threshold-label">Stale after
          <select id="stale-threshold">
            <option value="240" selected>4 hours</option>
            <option value="60">1 hour</option>
            <option value="5">5 minutes</option>
            <option value="1">1 minute (demo)</option>
          </select>
        </label>
        <button class="btn btn-ghost" id="check-stale-btn">Check stale incidents</button>
        <a class="btn btn-ghost" href="/pressing.html" id="pressing-link" hidden>Pressing maintenance calls</a>
        <button class="btn btn-primary" id="new-incident-btn">New incident</button>
      </div>

    </div>

    <!-- Tabs (dashboard.js showTab): the sections below carry data-tabs, the
         tabs each one appears in. The open tab is kept in the URL (#faults). -->
    <nav class="tabs" role="tablist" aria-label="Dashboard views">
      <button class="tab" role="tab" id="tab-all" aria-selected="true">Everything <span class="tab-count" id="count-all"></span></button>
      <button class="tab" role="tab" id="tab-maintenance" aria-selected="false">Maintenance <span class="tab-count" id="count-maintenance"></span></button>
      <button class="tab" role="tab" id="tab-faults" aria-selected="false">Faults <span class="tab-count" id="count-faults"></span></button>
      <button class="tab" role="tab" id="tab-archive" aria-selected="false">Archive <span class="tab-count" id="count-archive"></span></button>
    </nav>

    <section class="queue-section" data-tabs="all maintenance">
      <h2>Maintenance queue <span class="hint">FIFO — one at a time, in order</span></h2>
      <div class="actions-row" style="margin-bottom:12px">
        <button class="btn btn-ghost btn-sm" id="start-next-btn">Start next</button>
      </div>
      <div id="maintenance-queue"><p class="empty">Loading…</p></div>
    </section>

    <section class="queue-section" data-tabs="all faults">
      <h2>Fault queue <span class="hint">Priority order — most severe first, every severity together</span></h2>
      <div class="actions-row" style="margin-bottom:12px">
        <button class="btn btn-ghost btn-sm" id="claim-next-btn">Claim next</button>
      </div>
      <div id="fault-queue"><p class="empty">Loading…</p></div>
    </section>

    <!-- Not on the Maintenance tab: there the FIFO queue IS the list (every task in it is open or in progress). -->
    <section class="queue-section" data-tabs="all faults archive">
      <h2><span id="list-title">All incidents</span> <span class="hint" id="list-hint"></span></h2>
      <div id="incident-list"><p class="empty">Loading…</p></div>
    </section>
  </main>

  <dialog id="new-incident-dialog" class="dialog">
    <form id="new-incident-form" class="dialog-form">
      <h2>New incident</h2>
      <label>Kind
        <select name="kind" id="new-kind">
          <option value="maintenance">Maintenance task</option>
          <option value="fault">Fault / issue</option>
        </select>
      </label>
      <label>Title<input type="text" name="title" required></label>
      <label>Description<textarea name="description" rows="3" required></textarea></label>
      <fieldset id="fault-fields" class="fault-fields" hidden>
        <legend>Severity details (used to score the fault)</legend>
        <label class="checkbox"><input type="checkbox" name="system_unavailable"> System is unavailable</label>
        <label class="checkbox"><input type="checkbox" name="security_breach"> Security breach</label>
        <label class="checkbox"><input type="checkbox" name="performance_degraded"> Performance degraded</label>
        <label>Affected users (%)<input type="number" name="affected_users_percent" min="0" max="100" value="0"></label>
      </fieldset>
      <p class="form-error" id="new-incident-error" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="btn btn-ghost" data-action="cancel">Cancel</button>
        <button type="submit" class="btn btn-primary">Create</button>
      </div>
    </form>
  </dialog>

  <script type="module" src="/js/dashboard.js"></script>
  <script type="module" src="/js/footer.js"></script>
</body>
</html>
