[pytest]
# Tells pytest where to look for tests when it's run from inside the
# backend/ directory (this file's own location is what pytest uses as
# the project root, so this path is relative to backend/).
testpaths = tests

# -ra: at the end of the run, print a short summary line for every test
#      that was skipped, failed, or had an unexpected error - handy once
#      the suite grows large enough that scrolling up to find failures
#      gets annoying.
addopts = -ra
